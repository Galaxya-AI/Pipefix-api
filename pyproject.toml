[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ci-remediation"
version = "0.2.0"
description = "Multi-agent system that diagnoses failed CI pipelines and proposes fixes as merge requests."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2,<3",
    "requests>=2.31",
    "flask>=3.0",
    "gunicorn>=23",
    "redis>=5",
    "rq>=2",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy", "types-requests", "fakeredis[lua]"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "N"]

[tool.ruff.lint.isort]
known-first-party = [
    "agent_base", "agent_errors", "agent_runner", "agents", "app_runs", "changeset", "connectors", "fakes",
    "journal", "llm", "mcp_runtime", "policy", "redis_jobs", "startup", "text_tools", "tools", "workflow_analysis",
    "workflow_publication", "workflow_remediation",
]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
pythonpath = [".", "src", "tests"]
testpaths = ["tests"]
